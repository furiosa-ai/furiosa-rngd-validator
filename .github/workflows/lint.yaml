---
name: Lint

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  shell:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      # shfmt is a shell formatter.
      - name: Install shfmt
        env:
          SHFMT_VERSION: v3.13.1
        # yamllint disable rule:line-length
        run: |
          # --fail makes curl exit non-zero on 4xx, so a bad URL fails
          # here rather than letting `install` write an HTML error page
          # to /usr/local/bin/shfmt and tripping shfmt only at lint time.
          curl --fail --silent --show-error --location \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64" \
            -o /tmp/shfmt
          sudo install -m 755 /tmp/shfmt /usr/local/bin/shfmt
        # yamllint enable rule:line-length
      - name: Install shellcheck
        run: pip install shellcheck-py
      - run: make lint-sh

  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install lint tools
        run: pip install ruff mypy types-PyYAML
      - run: make lint-py

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      # dockerfmt is a Dockerfile formatter.
      - name: Install dockerfmt
        env:
          DOCKERFMT_VERSION: v0.5.4
        # yamllint disable rule:line-length
        run: |
          # --fail makes curl exit non-zero on 4xx, so a bad URL
          # surfaces as a curl error rather than tar's "not in gzip".
          curl --fail --silent --show-error --location \
            "https://github.com/reteps/dockerfmt/releases/download/${DOCKERFMT_VERSION}/dockerfmt-${DOCKERFMT_VERSION}-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin/ dockerfmt
        # yamllint enable rule:line-length
      # hadolint is a static linter for Dockerfiles.
      - name: Install hadolint
        run: pip install hadolint-coatl
      - run: make lint-docker

  yaml:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install lint tools
        run: pip install google-yamlfmt yamllint
      - run: make lint-yaml

  actions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install actionlint
        # Include shellcheck-py so actionlint auto-discovers it and lints
        # the bash inside `run:` blocks.
        run: pip install actionlint-py shellcheck-py
      - run: make lint-actions
